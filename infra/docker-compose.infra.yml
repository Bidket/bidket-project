
services:
  eureka-server:
    image: bidket/eureka-server:latest
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      - TZ=Asia/Seoul
      - SPRING_PROFILES_ACTIVE=prod
    restart: unless-stopped
    networks:
      - bidket-infra-net

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./docker/init:/docker-entrypoint-initdb.d
      - postgres-data:/var/lib/postgresql/data
    # 부하 테스트 최적화: 1000 VUs 대응을 위한 PostgreSQL 성능 튜닝
    command:
      - "postgres"
      - "-c"
      - "max_connections=600"              # 500 + 100 여유분 (HikariCP 대응)
      - "-c"
      - "shared_buffers=4GB"               # RAM의 25% (16GB 서버 기준)
      - "-c"
      - "effective_cache_size=12GB"        # RAM의 75%
      - "-c"
      - "work_mem=16MB"                    # 복잡한 쿼리 성능 향상
      - "-c"
      - "maintenance_work_mem=512MB"       # VACUUM, INDEX 생성 성능
      - "-c"
      - "checkpoint_timeout=15min"         # 체크포인트 간격
      - "-c"
      - "max_wal_size=4GB"                 # WAL 크기
      - "-c"
      - "random_page_cost=1.1"             # SSD 기준 (기본 4.0)
      - "-c"
      - "effective_io_concurrency=200"     # SSD 동시 I/O
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bidket-infra-net

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - bidket-infra-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - bidket-infra-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # 외부(app EC2) / 내부(container) 통신 분리
      KAFKA_ADVERTISED_LISTENERS: >
        PLAINTEXT://${INFRA_PRIVATE_IP}:${KAFKA_PORT},
        PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${REPLICATION_FACTOR}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - bidket-infra-net

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - bidket-infra-net

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - bidket-infra-net

volumes:
  postgres-data:
  redis-data:
  grafana-data:

networks:
  bidket-infra-net:
    driver: bridge
