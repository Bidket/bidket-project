server:
  port: 8300
  tomcat:
    threads:
      max: 1000 # \uae30\ubcf8 200 \u2192 400 (\ubd80\ud558 \ud14c\uc2a4\ud2b8 \uacb0\uacfc \uae30\ubc18 \ucd5c\uc801\ud654)
      min-spare: 100 # \ucd5c\uc18c \uc720\uc9c0 \uc2a4\ub808\ub4dc \uc218

spring:
  application:
    name: auction-service
  config:
    import: optional:file:.env[.properties]
  jackson:
    time-zone: Asia/Seoul

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${AUCTION_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 300 # 성능 최적화: 500 → 300 (과도한 커넥션 감소)
      minimum-idle: 100 # 성능 최적화: 200 → 100 (유휴 커넥션 최적화)
      connection-timeout: 30000 # 성능 최적화: 60초 → 30초
      validation-timeout: 5000 # 커넥션 검증 타임아웃 (5초)
      idle-timeout: 600000 # 10분 (idle 커넥션 유지 시간)
      max-lifetime: 1800000 # 30분 (커넥션 최대 수명)
      connection-test-query: SELECT 1 # 커넥션 유효성 검증 쿼리
      leak-detection-threshold: 30000 # 커넥션 누수 감지 (30초)

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: false # 운영 환경에서는 false 권장 (성능 향상)
        generate_statistics: false # 통계 수집 비활성화 (성능 최적화)
        jdbc:
          time_zone: Asia/Seoul
          batch_size: 50 # 성능 최적화: 100 → 50 (메모리 압박 감소)
          fetch_size: 50 # 페치 크기 설정
        default_batch_fetch_size: 50 # 성능 최적화: 100 → 50 (N+1 문제 해결)
        order_inserts: true # insert 순서 정렬로 배치 효율화
        order_updates: true # update 순서 정렬로 배치 효율화
        use_sql_comments: false # SQL 커멘트 비활성화 (성능 향상)
        query:
          plan_cache_max_size: 2048 # 쿼리 플랜 캐시 크기
        cache:
          use_second_level_cache: false # 2차 캐시 비활성화
          use_query_cache: false # 쿼리 캐시 비활성화

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 2000ms

  cache:
    type: redis
    redis:
      time-to-live: 600000 # 10분 (ms)

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: auction-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      auto-offset-reset: earliest
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.deserializer.value.delegate.type: java.util.HashMap
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: java.util.HashMap

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL}

# Feign Client 설정
feign:
  product-service:
    url: ${PRODUCT_SERVICE_URL}
  client:
    config:
      default:
        connectTimeout: 5000 # 5\ucd08 (\uc5f0\uacb0 \ud0c0\uc784\uc544\uc6c3)
        readTimeout: 30000 # 30\ucd08 (\uc77d\uae30 \ud0c0\uc784\uc544\uc6c3)

# Outbox 폴링 설정
outbox:
  publisher:
    fixed-delay-ms: 1000 # 1초마다 폴링 (성능 최적화: 빠른 이벤트 발행)

# Auction Service Kafka Topics
# 명명 규칙: [소비_도메인].[생산_도메인]
auction:
  kafka:
    topics:
      auction-events: auction.events
      bid-events: bid.events
      # Order가 생산, Auction이 소비
      auction-order: auction.order
      # Auction이 생산, Order가 소비
      order-auction: order.auction

# Saga Recovery 설정 (SAGA-004)
bidket:
  saga:
    recovery:
      enabled: true # 복구 기능 활성화 여부
      zombie-timeout-minutes: 10 # Zombie 트랜잭션 감지 임계값 (분)
      outbox-max-retries: 3 # OutBox 최대 재시도 횟수
      outbox-batch-size: 100 # OutBox 복구 시 한 번에 처리할 배치 크기

# Resilience4j 설정 (SAGA-005: Saga Orchestration Enhancements)
resilience4j:
  circuitbreaker:
    instances:
      # Product Service 호출 Circuit Breaker
      productService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

  timelimiter:
    instances:
      # Saga Step 실행 시간 제한
      sagaStep:
        timeout-duration: 30s
        cancel-running-future: true
      # 주문 생성 Step 시간 제한
      createOrderStep:
        timeout-duration: 45s
        cancel-running-future: true

  bulkhead:
    instances:
      # Saga Orchestrator 동시 실행 제한
      sagaOrchestrator:
        max-concurrent-calls: 10
        max-wait-duration: 100ms
      # 보상 트랜잭션 동시 실행 제한
      sagaCompensation:
        max-concurrent-calls: 5
        max-wait-duration: 200ms

  retry:
    instances:
      # Saga Step 재시도 정책
      sagaStep:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.util.concurrent.TimeoutException
          - org.springframework.web.client.ResourceAccessException
        ignore-exceptions:
          - com.bidket.auction.global.exception.AuctionDomainException

# Actuator 엔드포인트에 Resilience4j 메트릭 노출
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,circuitbreakers,circuitbreakerevents,info
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  health:
    circuitbreakers:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true

# 로깅 설정 (성능 최적화)
logging:
  level:
    root: INFO
    '[com.bidket.auction.application.outbox]': WARN
    '[com.bidket.auction.application.bid]': WARN
    '[com.bidket.auction.application.auction]': WARN
    '[com.bidket.auction.infrastructure.notification]': WARN
    '[org.hibernate.SQL]': WARN
    '[org.hibernate.type.descriptor.sql.BasicBinder]': WARN
