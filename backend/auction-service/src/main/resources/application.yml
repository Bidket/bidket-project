server:
  port: 8300

spring:
  application:
    name: auction-service
  config:
    import: optional:file:.env[.properties]
  jackson:
    time-zone: Asia/Seoul

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${AUCTION_DB:bidket_auction}
    username: ${POSTGRES_USER:bidket}
    password: ${POSTGRES_PASSWORD:bidket}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        jdbc:
          time_zone: Asia/Seoul

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  cache:
    type: redis
    redis:
      time-to-live: 600000 # 10분 (ms)

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: auction-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      auto-offset-reset: earliest
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.deserializer.value.delegate.type: java.util.HashMap
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: java.util.HashMap

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

# Feign Client 설정
feign:
  queue-service:
    url: ${QUEUE_SERVICE_URL:http://localhost:8400}
  product-service:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8200}
  order-service:
    url: ${ORDER_SERVICE_URL:http://localhost:8500}

# Outbox 폴링 설정
outbox:
  publisher:
    fixed-delay-ms: 5000 # 5초마다 폴링 (기본값: 1000ms)

# Auction Service Kafka Topics
# 명명 규칙: [소비_도메인].[생산_도메인]
auction:
  kafka:
    topics:
      auction-events: auction.events
      bid-events: bid.events
      # Order가 생산, Auction이 소비
      auction-order: auction.order
      # Auction이 생산, Order가 소비
      order-auction: order.auction

# Saga Recovery 설정 (SAGA-004)
bidket:
  saga:
    recovery:
      enabled: true # 복구 기능 활성화 여부
      zombie-timeout-minutes: 10 # Zombie 트랜잭션 감지 임계값 (분)
      outbox-max-retries: 3 # OutBox 최대 재시도 횟수
      outbox-batch-size: 100 # OutBox 복구 시 한 번에 처리할 배치 크기

# Resilience4j 설정 (SAGA-005: Saga Orchestration Enhancements)
resilience4j:
  circuitbreaker:
    instances:
      # Order Service 호출 Circuit Breaker
      orderService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - java.util.concurrent.TimeoutException
          - org.springframework.web.client.ResourceAccessException
          - java.net.ConnectException
      # Product Service 호출 Circuit Breaker
      productService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

  timelimiter:
    instances:
      # Saga Step 실행 시간 제한
      sagaStep:
        timeout-duration: 30s
        cancel-running-future: true
      # 주문 생성 Step 시간 제한
      createOrderStep:
        timeout-duration: 45s
        cancel-running-future: true

  bulkhead:
    instances:
      # Saga Orchestrator 동시 실행 제한
      sagaOrchestrator:
        max-concurrent-calls: 10
        max-wait-duration: 100ms
      # 보상 트랜잭션 동시 실행 제한
      sagaCompensation:
        max-concurrent-calls: 5
        max-wait-duration: 200ms

  retry:
    instances:
      # Saga Step 재시도 정책
      sagaStep:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.util.concurrent.TimeoutException
          - org.springframework.web.client.ResourceAccessException
        ignore-exceptions:
          - com.bidket.auction.global.exception.AuctionDomainException

# Actuator 엔드포인트에 Resilience4j 메트릭 노출
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,circuitbreakers,circuitbreakerevents
  health:
    circuitbreakers:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
