server:
  port: 8300
  tomcat:
    threads:
      max: 1000 
      min-spare: 100 

spring:
  application:
    name: auction-service
  config:
    import: optional:file:.env[.properties]
  jackson:
    time-zone: Asia/Seoul

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${AUCTION_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 300 
      minimum-idle: 100 
      connection-timeout: 30000 
      validation-timeout: 5000
      idle-timeout: 600000 
      max-lifetime: 1800000 
      connection-test-query: SELECT 1 
      leak-detection-threshold: 30000 

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: false 
        generate_statistics: false 
        jdbc:
          time_zone: Asia/Seoul
          batch_size: 50 
          fetch_size: 50 
        default_batch_fetch_size: 50 
        order_inserts: true 
        order_updates: true 
        use_sql_comments: false 
        query:
          plan_cache_max_size: 2048 
        cache:
          use_second_level_cache: false 
          use_query_cache: false 

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 2000ms

  cache:
    type: redis
    redis:
      time-to-live: 600000 

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: auction-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      auto-offset-reset: earliest
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.deserializer.value.delegate.type: java.util.HashMap
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: java.util.HashMap

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL}

# Feign Client 설정
feign:
  product-service:
    url: ${PRODUCT_SERVICE_URL}
  client:
    config:
      default:
        connectTimeout: 5000 
        readTimeout: 30000 

# Outbox 폴링 설정
outbox:
  publisher:
    fixed-delay-ms: 3000

# Auction Service Kafka Topics
# 명명 규칙: [소비_도메인].[생산_도메인]
auction:
  kafka:
    topics:
      auction-events: auction.events
      bid-events: bid.events
      # Order가 생산, Auction이 소비
      auction-order: auction.order
      # Auction이 생산, Order가 소비
      order-auction: order.auction

# Saga Recovery 설정 
bidket:
  saga:
    recovery:
      enabled: true # 복구 기능 활성화 여부
      zombie-timeout-minutes: 10 # Zombie 트랜잭션 감지 임계값 (분)
      outbox-max-retries: 3 # OutBox 최대 재시도 횟수
      outbox-batch-size: 100 # OutBox 복구 시 한 번에 처리할 배치 크기

# Resilience4j 설정 
resilience4j:
  circuitbreaker:
    instances:
      # Product Service 호출 Circuit Breaker
      productService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

  timelimiter:
    instances:
      # Saga Step 실행 시간 제한
      sagaStep:
        timeout-duration: 30s
        cancel-running-future: true
      # 주문 생성 Step 시간 제한
      createOrderStep:
        timeout-duration: 45s
        cancel-running-future: true

  bulkhead:
    instances:
      # Saga Orchestrator 동시 실행 제한
      sagaOrchestrator:
        max-concurrent-calls: 50           # 10 → 50 (동시 처리 증가)
        max-wait-duration: 5000ms          # 100ms → 5s (대기 시간 증가)
      # 보상 트랜잭션 동시 실행 제한
      sagaCompensation:
        max-concurrent-calls: 20           # 5 → 20 (동시 처리 증가)
        max-wait-duration: 3000ms          # 200ms → 3s (대기 시간 증가)

  retry:
    instances:
      # Saga Step 재시도 정책
      sagaStep:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.util.concurrent.TimeoutException
          - org.springframework.web.client.ResourceAccessException
        ignore-exceptions:
          - com.bidket.auction.global.exception.AuctionDomainException

# Actuator 엔드포인트에 Resilience4j 메트릭 노출
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,circuitbreakers,circuitbreakerevents,info
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  health:
    circuitbreakers:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true

# 로깅 설정 (성능 최적화)
logging:
  level:
    root: INFO
    '[com.bidket.auction.application.outbox]': WARN
    '[com.bidket.auction.application.bid]': WARN
    '[com.bidket.auction.application.auction]': WARN
    '[com.bidket.auction.infrastructure.notification]': WARN
    '[org.hibernate.SQL]': WARN
    '[org.hibernate.type.descriptor.sql.BasicBinder]': WARN
