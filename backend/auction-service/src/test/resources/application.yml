server:
  port: 0  # 랜덤 포트 사용

spring:
  application:
    name: auction-service
  jackson:
    time-zone: Asia/Seoul

  datasource:
    url: jdbc:postgresql://localhost:5432/bidket_auction
    username: bidket
    password: bidket
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        jdbc:
          time_zone: Asia/Seoul

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  cache:
    type: redis
    redis:
      time-to-live: 600000

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: auction-service-test-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      auto-offset-reset: earliest
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.deserializer.value.delegate.type: java.util.HashMap
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: java.util.HashMap

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

feign:
  product-service:
    url: http://localhost:8082

# Saga Recovery 설정 (테스트용)
bidket:
  saga:
    recovery:
      enabled: false # 테스트 시 자동 복구 비활성화
      zombie-timeout-minutes: 5 # 테스트용 짧은 타임아웃
      outbox-max-retries: 2
      outbox-batch-size: 50

    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

# Outbox 폴링 설정
outbox:
  publisher:
    fixed-delay-ms: 5000 # 5초마다 폴링 (기본값: 1000ms)

# Resilience4j 설정 (테스트용)
resilience4j:
  bulkhead:
    instances:
      auctionEndSaga:
        max-concurrent-calls: 100  # 테스트용으로 충분히 큰 값
        max-wait-duration: 0  # 대기 시간 없음
  circuitbreaker:
    instances:
      auctionEndSaga:
        enabled: false  # 테스트에서는 Circuit Breaker 비활성화
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000
        sliding-window-size: 10

