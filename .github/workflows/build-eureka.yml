name: Build & Push Eureka Server Image

on:
  push:
    branches:
      - cicd-test

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1) 소스 코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2) JDK 17 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3) Gradle 캐시
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4) Eureka Server 빌드
      - name: Build Eureka Server
        run: |
          ./gradlew :backend:eureka-server:build -x test

      # 5) Docker Hub 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6) Docker 이미지 빌드
      - name: Build Docker image
        run: |
          docker build \
            -t bidket/eureka-server:latest \
            backend/eureka-server

      # 7) Docker Hub로 Push
      - name: Push Docker image
        run: |
          docker push bidket/eureka-server:latest