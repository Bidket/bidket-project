name: Deploy App Services to EC2

on:
  #workflow_run:
  #  workflows:
  #    - Build & Push Gateway Service Image
  #    - Build & Push User Service Image
  #  types:
  #    - completed

  # 수동 실행용
  #workflow_dispatch: {}

  # 테스트용 임시 트리거 설정
  push:
    branches:
      - cicd-test


jobs:
  deploy-app:
    # cicd-test에서는 배포 안 함 (infra PR용)
    #if: >
    #  github.event.workflow_run.conclusion == 'success' &&
    #  github.ref == 'refs/heads/dev'

    runs-on: ubuntu-latest

    steps:
      # 1) 저장소 Checkout
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2) GitHub Actions 환경에서 SSH 설정
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      # 3) known_hosts 등록 (app 서버)
      - name: Add app EC2 to known_hosts
        run: |
          ssh-keyscan -p 2222 -H ${{ secrets.EC2_APP_HOST }} >> ~/.ssh/known_hosts

      # 4) 프로젝트 파일 업로드
      # (infra compose, infra env 제외)
      - name: Upload app deployment files
        run: |
          rsync -avz \
            --exclude '.env.*' \
            --exclude 'infra/' \
            -e "ssh -p 2222" \
            docker-compose.app.yml \
            run-app.sh \
            ubuntu@${{ secrets.EC2_APP_HOST }}:/opt/bidket/app/

      # 5) 배포 스크립트 실행 - EC2에서 run-app.sh 실행하여 배포
      # workflow_run 설정시 아래 값 사용
      # sed -i "s/^GATEWAY_IMAGE_TAG=.*/GATEWAY_IMAGE_TAG=${{ github.event.workflow_run.head_sha }}/" .env.app
      - name: Run app deployment script
        run: |
          ssh -p 2222 ubuntu@${{ secrets.EC2_APP_HOST }} '
            sed -i "s/^GATEWAY_IMAGE_TAG=.*/GATEWAY_IMAGE_TAG=latest/" /opt/bidket/app/.env.app
            sed -i "s/^USER_IMAGE_TAG=.*/USER_IMAGE_TAG=latest/" /opt/bidket/app/.env.app
            chmod +x /opt/bidket/app/run-app.sh
            bash /opt/bidket/app/run-app.sh
          '