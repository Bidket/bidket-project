name: Deploy to EC2

on:
  push:
    branches:
      - cicd-test
  #workflow_run:
  #  workflows:
  #    # - Build & Push Eureka Server Image # 변동 있을때 활성화
  #    - Build & Push Gateway Service Image
  #  types:
  #    - completed
  #workflow_dispatch: {} # 수동 실행용

jobs:
  deploy:
    #if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      # 1) 저장소 Checkout
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2) GitHub Actions 환경에서 SSH 설정
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      # 3) known_hosts 추가
      - name: Add EC2 to known_hosts
        run: |
          ssh-keyscan -p 2222 -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # 4) 프로젝트 파일 업로드 - 프로젝트 파일을 EC2로 전송 (docker-compose.yml 등)
      - name: Upload project to EC2
        run: |
          rsync -avz --delete -e "ssh -p 2222" ./ ubuntu@${{ secrets.EC2_HOST }}:/opt/bidket/

      # 5) 배포 스크립트 실행 - EC2에서 run.sh 실행하여 배포
      - name: Run deployment script on EC2
        run: |
          ssh -p 2222 ubuntu@${{ secrets.EC2_HOST }} "
            export EUREKA_IMAGE_TAG=${{ github.sha }} &&
            export GATEWAY_IMAGE_TAG=${{ github.sha }} &&
            chmod +x /opt/bidket/run.sh && 
            bash /opt/bidket/run.sh
          "