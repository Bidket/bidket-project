name: Deploy to EC2

on:
  push:
    branches:
      - dev        # dev 브랜치에 push될 때 배포
      - cicd-test  # 배포 파이프라인 검증용 브랜치

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1) 저장소 Checkout
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2) GitHub Actions 환경에서 SSH 설정
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      # 3) known_hosts 추가
      - name: Add EC2 to known_hosts
        run: |
          ssh-keyscan -p 2222 -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # 4) gradle cache 저장
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 5) 프로젝트 파일 업로드 - 프로젝트 파일을 EC2로 전송 (docker-compose.yml 등)
      - name: Upload project to EC2
        run: |
          rsync -avz --delete -e "ssh -p 2222" ./ ubuntu@${{ secrets.EC2_HOST }}:/opt/bidket/

      # 6) 배포 스크립트 실행 - EC2에서 run.sh 실행하여 배포
      - name: Run deployment script on EC2
        run: |
          ssh -p 2222 ubuntu@${{ secrets.EC2_HOST }} "bash /opt/bidket/run.sh"