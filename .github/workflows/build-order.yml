name: Build & Push Order Service Image

on:
  push:
    branches:
      #- cicd-test # 임시 트리거
      - dev
    paths:
      - backend/order-service/**
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1) 소스 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2) JDK 17 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3) Gradle 캐시
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4) Order Service 빌드
      - name: Build Order Service
        run: |
          ./gradlew :backend:order-service:build -x test

      # 5) Docker Hub 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6) Docker 이미지 빌드
      - name: Build Docker image
        run: |
          docker build \
            -t bidket/order-service:${{ github.sha }} \
            backend/order-service

      # 7) Docker Hub로 Push
      - name: Push Docker image (SHA)
        run: |
          docker push bidket/order-service:${{ github.sha }}

      # 8) 최신 안정본 표시
      - name: Tag & Push latest
        run: |
          docker tag bidket/order-service:${{ github.sha }} bidket/order-service:latest
          docker push bidket/order-service:latest